name: Solicitar programa, site ou sistema
description: Descreva o projeto desejado e como verificar se ficou pronto.
title: "[Projeto]: "
body:
  - type: markdown
    attributes:
      value: |
        Conte o que você precisa. Não inclua senhas, tokens ou dados pessoais sensíveis.
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Que problema o projeto deve resolver?
      placeholder: Quero construir...
    validations:
      required: true
  - type: textarea
    id: usuarios
    attributes:
      label: Usuários e contexto
      description: Quem vai usar o projeto e em que situação?
  - type: textarea
    id: funcionalidades
    attributes:
      label: Funcionalidades desejadas
      description: Liste as principais ações que o projeto deve permitir.
      placeholder: |
        - Deve ser possível...
        - Também preciso que...
    validations:
      required: true
  - type: textarea
    id: tecnologia
    attributes:
      label: Preferências técnicas
      description: Informe linguagem, framework ou integrações preferidas. Se não souber, peça uma sugestão.
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      description: Como vamos confirmar que o projeto está funcionando?
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: restricoes
    attributes:
      label: Custos, hospedagem e privacidade
      description: Informe se precisa rodar localmente, evitar custos recorrentes ou atender requisitos de privacidade. Não compartilhe credenciais.
  - type: textarea
    id: referencias
    attributes:
      label: Referências e detalhes adicionais
      description: Adicione exemplos ou links públicos úteis.
